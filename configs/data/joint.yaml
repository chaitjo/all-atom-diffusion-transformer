datamodule:
  _target_: src.data.joint_datamodule.JointDataModule

  datasets:

    mp20:
      _target_: src.data.components.mp20_dataset.MP20
      root: ${paths.data_dir}/mp_20
      proportion: 1.0

    qm9:
      _target_: src.data.components.geom_dataset.GEOM
      root: ${paths.data_dir}/geom
      removeHs: false  # only retain heavy atoms
      proportion: 1.0

  batch_size:
    train: 512
    val: 512
    test: 512

  num_workers:
    train: 16
    val: 16
    test: 16
